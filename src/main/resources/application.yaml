spring:
  datasource:
    url: jdbc:h2:mem:camunda-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true

camunda:
    bpm:
        admin-user:
          id: admin
          password: admin
          password-confirm: admin
        filter:
          create: All tasks
        job-execution:
          wait-time-in-millis: 1000 # Default is 5000ms, but for testing purposes we can set it to a lower value